spring.application.name=event-reservation

# Server
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/reservation_db
spring.datasource.username=admin
spring.datasource.password=secretpassword
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka Bootstrap Server
spring.kafka.bootstrap-servers=localhost:9092

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer Configuration
spring.kafka.consumer.group-id=reservation-group-v10
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Critical Type Mapping Fixes for Spring Kafka 4.x
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.project.eventreservation.dto.ReservationEvent



# 1. Gag the Kafka internal chatter
# This stops the massive wall of Producer/Consumer configuration text on startup
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN

# 2. Quiet down Spring's internal diagnostics
logging.level.org.springframework=WARN
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO

# 3. Enforce visibility for YOUR code
# This ensures every log.info() and log.error() you wrote actually prints
logging.level.com.project.eventreservation=INFO

